<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
    <meta name="theme-color" content="#f8f9fc">
    <title>Void Code AI — ИИ-платформа для разработки</title>

    <!-- SEO: мета-описание для сниппетов в Яндекс/Google (150-160 символов) -->
    <meta name="description" content="Void Code AI — платформа с ИИ-чатом, агентами, генерацией изображений и голосовым помощником. Пишите код и решайте задачи с разными ИИ-моделями." />

    <!-- Фавикон/иконка в поисковой выдаче и на вкладке браузера.
         SVG — современным браузерам (масштабируется без потери качества),
         .ico — обязательный фолбэк для тех, кто SVG-фавиконы не понимает
         (в т.ч. часть роботов индексации). -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
    <link rel="icon" href="/favicon-16.png" type="image/png" sizes="16x16">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">

    <!-- Open Graph / Twitter Card — превью со ссылкой в мессенджерах и соцсетях -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Void Code AI" />
    <meta property="og:title" content="Void Code AI — ИИ-платформа для разработки" />
    <meta property="og:description" content="Платформа с ИИ-чатом, агентами, генерацией изображений и голосовым помощником. Пишите код и решайте задачи с разными ИИ-моделями." />
    <meta property="og:image" content="https://void-code.ru/og-image.png" />
    <meta property="og:url" content="https://void-code.ru/" />
    <meta property="og:locale" content="ru_RU" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Void Code AI — ИИ-платформа для разработки" />
    <meta name="twitter:description" content="Платформа с ИИ-чатом, агентами, генерацией изображений и голосовым помощником." />
    <meta name="twitter:image" content="https://void-code.ru/og-image.png" />

    <!-- ТЕМА ДО ПЕРВОЙ ОТРИСОВКИ: читаем сохранённую сессию и ставим класс .dark
         на <html> раньше, чем браузер что-либо нарисует. Это убирает «вспышку»
         светлой темы при загрузке в тёмном режиме. -->
    <script>
        (function () {
            try {
                var s = JSON.parse(localStorage.getItem('voidcode_session_v1') || 'null');
                if (s && s.isDarkMode) {
                    document.documentElement.classList.add('dark');
                    document.documentElement.style.colorScheme = 'dark';
                    var m = document.querySelector('meta[name="theme-color"]');
                    if (m) m.setAttribute('content', '#0f0f13');
                }
            } catch (e) { /* повреждённый localStorage не должен ломать загрузку */ }
        })();
    </script>

    <!-- Реальная высота вьюпорта (--vh): работает до загрузки React,
         сглаживает появление клавиатуры на мобильных. -->
    <script>
        (function () {
            var rafId = null;
            function applyHeight() {
                rafId = null;
                var h = (window.visualViewport ? window.visualViewport.height : window.innerHeight);
                document.documentElement.style.setProperty('--vh', (h * 0.01) + 'px');
                if (window.scrollX !== 0 || window.scrollY !== 0) window.scrollTo(0, 0);
            }
            function setAppHeight() {
                if (rafId !== null) return;
                rafId = requestAnimationFrame(applyHeight);
            }
            applyHeight();
            window.addEventListener('resize', setAppHeight);
            window.addEventListener('orientationchange', setAppHeight);
            if (window.visualViewport) {
                window.visualViewport.addEventListener('resize', setAppHeight);
                window.visualViewport.addEventListener('scroll', setAppHeight);
            }
        })();
    </script>
</head>
<body class="bg-[#f8f9fc] dark:bg-darkBg text-gray-900 dark:text-gray-100 overflow-hidden select-none font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
</body>
</html>
