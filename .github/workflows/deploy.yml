name: Deploy to VPS

on:
  push:
    branches: [ main ] # Срабатывает при каждом пуше в ветку main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/void-code-ai-clean
            git pull origin main

            # Бэкенд: ставим зависимости, прогоняем миграции БД, собираем, перезапускаем
            cd apps/api
            npm install
            # В проекте нет папки prisma/migrations — схема синхронизируется
            # напрямую через db push (migrate deploy падал с P3005 на
            # непустой базе без истории миграций). db push добавляет новые
            # поля/таблицы из schema.prisma, не трогая существующие данные.
            npx prisma generate
            npx prisma db push --skip-generate
            npm run build
            pm2 restart void-code-api || pm2 start ecosystem.config.js

            # Фронтенд: собираем статику, перезапускаем nginx
            cd ../web
            npm install
            npm run build
            systemctl restart nginx
